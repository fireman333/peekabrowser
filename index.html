<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Peekabrowser</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>document.addEventListener('contextmenu', e => e.preventDefault());</script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <nav id="rail" data-i18n-aria="rail.label">
        <div id="tab-list" role="list"></div>

        <div id="rail-footer" role="group" data-i18n-aria="rail.footer">
          <div class="rail-divider" role="separator"></div>
          <button class="foot-btn" id="records-btn" data-icon="sf-clock" data-i18n-aria="rail.records" data-i18n-title="rail.records"></button>
          <button class="foot-btn" id="pin-btn" data-icon="sf-pin" data-i18n-aria="rail.pin" aria-pressed="false" data-i18n-title="rail.pin"></button>
          <button class="foot-btn" id="settings-btn" data-icon="sf-gear" data-i18n-aria="side.settings" data-i18n-title="side.settings"></button>
        </div>
      </nav>
      <div id="status-live" class="visually-hidden" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
