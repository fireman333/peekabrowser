# Permission sets for the app's own commands (generated per command from
# build.rs into permissions/autogenerated).

[[set]]
identifier = "local-windows"
description = "Every app command, for Peekabrowser's own bundled windows."
permissions = [
  "allow-toggle-sidebar",
  "allow-toggle-pin",
  "allow-is-pinned",
  "allow-show-sidebar",
  "allow-hide-sidebar",
  "allow-open-system-app",
  "allow-get-destinations",
  "allow-add-destination",
  "allow-update-destination",
  "allow-remove-destination",
  "allow-reorder-destinations",
  "allow-switch-destination",
  "allow-new-tab",
  "allow-new-tab-for-active",
  "allow-send-to-active",
  "allow-get-clipboard-text",
  "allow-set-viewer-width",
  "allow-resize-drag",
  "allow-get-picker-data",
  "allow-pick-destination",
  "allow-hide-picker-panel",
  "allow-open-settings-url",
  "allow-regrant-accessibility",
  "allow-open-trackpad-settings",
  "allow-open-settings-window",
  "allow-get-pages",
  "allow-switch-page",
  "allow-close-page",
  "allow-take-screenshot",
  "allow-reload-active-page",
  "allow-go-back",
  "allow-go-forward",
  "allow-open-active-in-browser",
  "allow-get-shortcuts",
  "allow-save-shortcuts",
  "allow-get-system-config-data",
  "allow-create-system-item",
  "allow-close-system-config",
  "allow-run-ocr",
  "allow-save-answer",
  "allow-list-records",
  "allow-update-record",
  "allow-delete-record",
  "allow-get-record-attachment",
  "allow-copy-record-markdown",
  "allow-export-record-markdown",
  "allow-open-record",
  "allow-open-records-window",
  "allow-get-app-settings",
  "allow-save-app-settings",
  "allow-get-autostart",
  "allow-set-autostart",
  "allow-get-diagnostics",
  "allow-get-material-kind",
  "allow-get-app-version",
  "allow-get-update-status",
  "allow-check-for-updates",
  "allow-install-update",
  "allow-open-release-page",
  "allow-get-chrome-state",
  "allow-chrome-navigate",
  "allow-refresh-chrome",
  "allow-reopen-closed-tab",
  "allow-close-other-tabs",
  "allow-close-tabs-to-right",
  "allow-cycle-tab",
  "allow-copy-page-url",
  "allow-open-page-in-browser",
  "allow-reload-page",
  "allow-show-chrome-menu",
  "allow-show-tab-menu",
  "allow-get-prompt-templates",
  "allow-set-prompt-profession",
  "allow-set-template-prompts",
  "allow-restore-template-prompts",
  "allow-get-destination-prompts",
  "allow-set-destination-prompts",
  "allow-resize-picker",
]

[[set]]
identifier = "page-shortcuts"
description = "Only what the script injected into web pages invokes (tab shortcuts)."
permissions = [
  "allow-close-page",
  "allow-new-tab-for-active",
  "allow-cycle-tab",
  "allow-reopen-closed-tab",
]
