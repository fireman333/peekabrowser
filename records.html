<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Peekabrowser Records</title>
  <link rel="stylesheet" href="/src/records.css" />
  <script type="module" src="/src/records.ts" defer></script>
</head>
<body>
  <div id="records-app">
    <aside id="list-pane">
      <div id="toolbar">
        <input id="search" type="search" data-i18n-placeholder="rec.searchPh" data-i18n-aria="rec.searchLabel" autocomplete="off" />
        <label class="fav-filter" data-i18n-title="rec.favOnly">
          <input type="checkbox" id="fav-only" data-i18n-aria="rec.favOnly" /> <span data-icon="star"></span>
        </label>
      </div>
      <ul id="record-list" role="listbox" data-i18n-aria="rec.listLabel"></ul>
    </aside>
    <main id="detail" aria-live="polite"></main>
  </div>
</body>
</html>
