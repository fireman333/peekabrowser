<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="/src/picker.css" />
  <script type="module" src="/src/picker.ts" defer></script>
</head>
<body>
  <div id="picker-card" role="dialog" aria-labelledby="picker-title">
    <div id="picker-header">
      <span id="picker-title">Send to…</span>
      <button id="picker-close" data-icon="close" aria-label="Dismiss (Esc)" title="Dismiss (Esc)"></button>
    </div>
    <div id="picker-preview" aria-live="polite"></div>
    <div id="picker-list" role="listbox" aria-label="Destinations"></div>
    <div id="picker-hint">C V B N M 快速選擇 · Esc 關閉</div>
  </div>
</body>
</html>
