<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Peekabrowser</title>
  <link rel="stylesheet" href="/src/theme.css" />
  <link rel="stylesheet" href="/src/settings.css" />
  <script type="module" src="/src/settings.ts" defer></script>
</head>
<body>
  <div id="settings-app">

    <!-- ─── Main page ─── -->
    <div id="view-main">
      <h1 data-i18n="settings.title"></h1>

      <!-- Accessibility warning (only when ⌘C ⌘C is off) -->
      <section class="section hidden" id="copy-ax-row">
        <div class="group">
          <div class="row warn-row">
            <span class="row-text">
              <strong data-i18n="s.axTitle"></strong>
              <small data-i18n="s.axHelp"></small>
            </span>
            <button id="copy-ax-open" class="btn-secondary" data-i18n="copy.axOpen"></button>
          </div>
        </div>
      </section>

      <!-- 1. When you look something up -->
      <section class="section">
        <h2 data-i18n="s.sec.lookup"></h2>
        <div class="group">
          <div class="row">
            <span class="row-label" data-i18n="s.fromApps"></span>
            <div class="segmented" id="seg-mode" role="radiogroup" data-i18n-aria="s.fromApps">
              <button type="button" role="radio" data-mode="last_used" data-i18n="s.mode.last"></button>
              <button type="button" role="radio" data-mode="fixed" data-i18n="s.mode.fixed"></button>
              <button type="button" role="radio" data-mode="choose" data-i18n="s.mode.choose"></button>
            </div>
          </div>
          <div class="row hidden" id="fixed-row">
            <label class="row-label" for="opt-fixed-dest" data-i18n="s.sendTo"></label>
            <select id="opt-fixed-dest"></select>
          </div>
        </div>
        <p class="footer" data-i18n="s.fromApps.foot"></p>

        <div class="group">
          <label class="row">
            <span class="row-label" data-i18n="s.autoSubmit"></span>
            <input type="checkbox" class="switch" id="opt-auto-submit" />
          </label>
        </div>
        <p class="footer" data-i18n="s.autoSubmit.foot"></p>

        <div class="group">
          <label class="row">
            <span class="row-label" data-i18n="s.threeFinger"></span>
            <input type="checkbox" class="switch" id="opt-three-finger" />
          </label>
        </div>
        <p class="footer">
          <span data-i18n="s.threeFinger.foot"></span>
          <button type="button" id="open-trackpad" class="link" data-i18n="s.openTrackpad"></button>
        </p>
      </section>

      <!-- 2. Your AIs and search sites -->
      <section class="section">
        <div class="section-head">
          <h2 data-i18n="s.sec.sites"></h2>
          <button type="button" id="reorder-btn" class="link" data-i18n="s.reorder"></button>
        </div>
        <div class="group" id="sites-group">
          <div id="destinations-list"></div>
          <button type="button" id="add-btn" class="row row-button link" data-i18n="s.addSite"></button>
        </div>
        <p class="footer" data-i18n="s.sites.foot"></p>
      </section>

      <!-- 3. Use it from other apps -->
      <section class="section shortcuts-section">
        <h2 data-i18n="s.sec.other"></h2>
        <div class="group">
          <label class="row">
            <span class="row-label" data-i18n="s.edge"></span>
            <input type="checkbox" class="switch" id="opt-edge-hover" />
          </label>
          <label class="row">
            <span class="row-label" data-i18n="gen.autostart"></span>
            <input type="checkbox" class="switch" id="opt-autostart" />
          </label>
        </div>

        <h3 class="sub-title" data-i18n="s.shortcuts"></h3>
        <div class="group">
          <div class="row shortcut-row" data-action="toggle_sidebar">
            <span class="row-label" data-i18n="keys.toggle"></span>
            <kbd class="shortcut-key" tabindex="0"></kbd>
          </div>
          <div class="row shortcut-row" data-action="screenshot">
            <span class="row-label" data-i18n="keys.screenshot"></span>
            <kbd class="shortcut-key" tabindex="0"></kbd>
          </div>
          <div class="row shortcut-row" data-action="export">
            <span class="row-label" data-i18n="keys.export"></span>
            <kbd class="shortcut-key" tabindex="0"></kbd>
          </div>
        </div>
        <p class="footer" data-i18n="s.shortcuts.foot"></p>

        <h3 class="sub-title" data-i18n="s.fixedKeys"></h3>
        <div class="group">
          <div class="row fixed-row"><span class="row-label" data-i18n="keys.copy"></span><kbd>⌘C ⌘C</kbd></div>
          <div class="row fixed-row"><span class="row-label" data-i18n="keys.reload"></span><kbd>⌘R</kbd></div>
          <div class="row fixed-row"><span class="row-label" data-i18n="keys.close"></span><kbd>⌘W</kbd></div>
          <div class="row fixed-row"><span class="row-label" data-i18n="s.newTab"></span><kbd>⌘T</kbd></div>
          <div class="row fixed-row"><span class="row-label" data-i18n="s.reopenTab"></span><kbd>⌘⇧T</kbd></div>
        </div>
      </section>

      <!-- 4. General -->
      <section class="section update-section">
        <h2 data-i18n="s.sec.general"></h2>
        <div class="group">
          <label class="row">
            <span class="row-label" data-i18n="gen.language"></span>
            <select id="opt-language">
              <option value="zh-TW">繁體中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>

        <h3 class="sub-title" data-i18n="upd.section"></h3>
        <div class="group">
          <div class="row update-row">
            <span class="row-text">
              <strong>Peekabrowser <span id="app-version"></span></strong>
              <small id="update-message">—</small>
            </span>
            <div class="update-actions">
              <button id="update-check" class="btn-secondary" data-i18n="upd.check"></button>
              <button id="update-install" class="btn-primary hidden" data-i18n="upd.install"></button>
            </div>
          </div>
          <label class="row">
            <span class="row-label" data-i18n="upd.autoCheck"></span>
            <input type="checkbox" class="switch" id="opt-auto-check" />
          </label>
          <label class="row">
            <span class="row-label" data-i18n="upd.autoInstall"></span>
            <input type="checkbox" class="switch" id="opt-auto-install" />
          </label>
        </div>
        <p class="footer" data-i18n="upd.autoInstallHelp"></p>
        <details id="update-notes" class="hidden"><summary data-i18n="upd.notes"></summary><pre id="update-notes-body"></pre></details>
      </section>

      <!-- 5. About -->
      <section class="section">
        <h2 data-i18n="s.sec.about"></h2>
        <div class="group">
          <button type="button" id="open-github" class="row row-button">
            <span class="row-label" data-i18n="s.github"></span>
            <span class="chev">›</span>
          </button>
          <div class="row">
            <span class="row-label" data-i18n="s.license"></span>
            <span class="row-value">MIT</span>
          </div>
        </div>
        <p class="signature" id="signature"></p>
      </section>
    </div>

    <!-- ─── Site detail / add page ─── -->
    <div id="view-site" class="hidden">
      <button type="button" id="back-btn" class="link back" data-i18n="s.back"></button>
      <h1 id="form-title" data-i18n="s.site.addTitle"></h1>

      <section class="section" id="catalog-section">
        <h2 data-i18n="s.site.catalog"></h2>
        <div id="preset-chips"></div>
      </section>

      <div id="add-form">
        <div class="group fields">
          <div class="field">
            <label for="new-name" data-i18n="dest.name"></label>
            <input id="new-name" type="text" data-i18n-placeholder="dest.namePh" />
          </div>
          <div class="field">
            <label for="new-url" data-i18n="dest.url"></label>
            <input id="new-url" type="text" data-i18n-placeholder="dest.urlPh" />
          </div>
          <div class="field">
            <label for="new-icon" data-i18n="dest.icon"></label>
            <input id="new-icon" type="text" data-i18n-placeholder="dest.iconPh" maxlength="2" />
          </div>
          <div class="field">
            <label for="new-clip-prompt" data-i18n="dest.prompt"></label>
            <textarea id="new-clip-prompt" rows="3" data-i18n-placeholder="dest.promptPh"></textarea>
          </div>
        </div>
        <p class="footer" data-i18n="s.site.promptHelp"></p>

        <div class="form-actions">
          <button id="save-btn" class="btn-primary" data-i18n="common.save"></button>
          <button id="cancel-btn" class="btn-secondary" data-i18n="common.cancel"></button>
        </div>
        <button type="button" id="delete-btn" class="link danger hidden" data-i18n="s.site.delete"></button>
      </div>
    </div>
  </div>
</body>
</html>
