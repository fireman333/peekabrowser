<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Peekabrowser</title>
  <link rel="stylesheet" href="/src/settings.css" />
  <script type="module" src="/src/settings.ts" defer></script>
</head>
<body>
  <div id="settings-app">
    <h1 data-i18n="settings.title"></h1>

    <!-- Destinations -->
    <section class="group">
      <h2 data-i18n="dest.section"></h2>
      <p class="hint" data-i18n="dest.hint"></p>
      <div id="destinations-list"></div>
      <button id="add-btn" class="btn-secondary" data-i18n="dest.add"></button>

      <div id="add-form" class="card hidden">
        <h3 id="form-title" data-i18n="dest.addTitle"></h3>
        <div class="form-group">
          <span class="field-label" data-i18n="dest.presets"></span>
          <div id="preset-chips"></div>
        </div>
        <div class="form-group">
          <label for="new-name" data-i18n="dest.name"></label>
          <input id="new-name" type="text" data-i18n-placeholder="dest.namePh" />
        </div>
        <div class="form-group">
          <label for="new-url" data-i18n="dest.url"></label>
          <input id="new-url" type="text" data-i18n-placeholder="dest.urlPh" />
        </div>
        <div class="form-group">
          <label for="new-icon" data-i18n="dest.icon"></label>
          <input id="new-icon" type="text" data-i18n-placeholder="dest.iconPh" maxlength="2" />
        </div>
        <div class="form-group">
          <label for="new-clip-prompt"><span data-i18n="dest.prompt"></span> <small class="label-help" data-i18n="dest.promptHelp"></small></label>
          <textarea id="new-clip-prompt" rows="2" data-i18n-placeholder="dest.promptPh"></textarea>
        </div>
        <div class="form-actions">
          <button id="save-btn" class="btn-primary" data-i18n="common.save"></button>
          <button id="cancel-btn" class="btn-secondary" data-i18n="common.cancel"></button>
        </div>
      </div>
    </section>

    <!-- ⌘C ⌘C -->
    <section class="group">
      <h2 data-i18n="copy.section"></h2>
      <div class="card list">
        <label class="row">
          <span class="row-text">
            <strong data-i18n="copy.autoFirst"></strong>
            <small data-i18n="copy.autoFirstHelp"></small>
          </span>
          <input type="checkbox" class="switch" id="opt-auto-first" />
        </label>
      </div>
    </section>

    <!-- Appearance & power -->
    <section class="group">
      <h2 data-i18n="power.section"></h2>
      <div class="card list">
        <label class="row">
          <span class="row-text">
            <strong data-i18n="power.edge"></strong>
            <small data-i18n="power.edgeHelp"></small>
          </span>
          <input type="checkbox" class="switch" id="opt-edge-hover" />
        </label>
        <label class="row">
          <span class="row-text">
            <strong data-i18n="power.material"></strong>
            <small data-i18n="power.materialHelp"></small>
          </span>
          <input type="checkbox" class="switch" id="opt-material" />
        </label>
        <label class="row">
          <span class="row-text">
            <strong data-i18n="power.unload"></strong>
            <small data-i18n="power.unloadHelp"></small>
          </span>
          <select id="opt-unload">
            <option value="120" data-min="2"></option>
            <option value="300" data-min="5"></option>
            <option value="600" data-min="10"></option>
            <option value="1800" data-min="30"></option>
          </select>
        </label>
      </div>
      <p class="hint footnote" id="diagnostics"></p>
    </section>

    <!-- Shortcuts -->
    <section class="group shortcuts-section">
      <h2 data-i18n="keys.section"></h2>
      <p class="hint" data-i18n="keys.hint"></p>
      <div class="card list">
        <div class="shortcut-row" data-action="toggle_sidebar">
          <span data-i18n="keys.toggle"></span>
          <kbd class="shortcut-key" tabindex="0"></kbd>
        </div>
        <div class="shortcut-row" data-action="screenshot">
          <span data-i18n="keys.screenshot"></span>
          <kbd class="shortcut-key" tabindex="0"></kbd>
        </div>
        <div class="shortcut-row" data-action="export">
          <span data-i18n="keys.export"></span>
          <kbd class="shortcut-key" tabindex="0"></kbd>
        </div>
        <div class="shortcut-row fixed-row"><span data-i18n="keys.copy"></span><kbd>⌘C ⌘C</kbd></div>
        <div class="shortcut-row fixed-row"><span data-i18n="keys.reload"></span><kbd>⌘R</kbd></div>
        <div class="shortcut-row fixed-row"><span data-i18n="keys.close"></span><kbd>⌘W</kbd></div>
      </div>
    </section>

    <!-- Updates -->
    <section class="group update-section">
      <h2 data-i18n="upd.section"></h2>
      <div class="card list">
        <div class="row update-row">
          <span class="row-text">
            <strong>Peekabrowser <span id="app-version"></span></strong>
            <small id="update-message">—</small>
          </span>
          <div class="update-actions">
            <button id="update-check" class="btn-secondary" data-i18n="upd.check"></button>
            <button id="update-install" class="btn-primary hidden" data-i18n="upd.install"></button>
          </div>
        </div>
        <label class="row">
          <span class="row-text">
            <strong data-i18n="upd.autoCheck"></strong>
            <small data-i18n="upd.autoCheckHelp"></small>
          </span>
          <input type="checkbox" class="switch" id="opt-auto-check" />
        </label>
        <label class="row">
          <span class="row-text">
            <strong data-i18n="upd.autoInstall"></strong>
            <small data-i18n="upd.autoInstallHelp"></small>
          </span>
          <input type="checkbox" class="switch" id="opt-auto-install" />
        </label>
      </div>
      <details id="update-notes" class="hidden"><summary data-i18n="upd.notes"></summary><pre id="update-notes-body"></pre></details>
    </section>

    <!-- General -->
    <section class="group">
      <h2 data-i18n="gen.section"></h2>
      <div class="card list">
        <label class="row">
          <span class="row-text">
            <strong data-i18n="gen.language"></strong>
            <small data-i18n="gen.languageHelp"></small>
          </span>
          <select id="opt-language">
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="row">
          <span class="row-text">
            <strong data-i18n="gen.autostart"></strong>
            <small data-i18n="gen.autostartHelp"></small>
          </span>
          <input type="checkbox" class="switch" id="opt-autostart" />
        </label>
      </div>
    </section>
  </div>
</body>
</html>
